services:
  app:
    image: ghcr.io/ferilee/rakitapp:latest
    container_name: rakitapp
    ports:
      - "2005:2005"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 2005
      DATABASE_URL: /app/data/app.db

      S3_ENDPOINT: ${S3_ENDPOINT:-http://global-storage:9000}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://s3.gemastika.or.id}
      S3_BUCKET: ${S3_BUCKET:-rakitapp-assets}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - sqlite_data:/app/data
    networks:
      - ferileenet
    restart: always

volumes:
  sqlite_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/data/rakitapp/sqlite

networks:
  ferileenet:
    external: true
